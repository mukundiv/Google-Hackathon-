# Publishes the console to GitHub Pages.
#
# The site is static: the six screens carry a snapshot of the real engine's
# output, so there is nothing to cold-start and nothing that can fall over in
# front of a judge. The Ask Gemini panel serves its saved answers here — making
# it live needs a server-side key, which means a host with functions (see
# DEPLOY.md for the Cloudflare path).
#
# Publishing goes through the gh-pages branch rather than the Pages deployment
# API. The API route needs the Pages site to exist first, and the token this
# workflow gets is not allowed to create one — actions/configure-pages answers
# "Resource not accessible by integration". A branch push needs no such
# permission: GitHub runs its own "pages build and deployment" on gh-pages and
# serves the result.
name: Deploy console to Pages

on:
  push:
    branches: [claude/creator-opportunity-engine-h1jlda]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# Let a running deploy finish rather than cancelling it — a half-deployed site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # Pages serves this repo at /<repo-name>/, so assets need that prefix.
        # Routing is hash-based and the snapshot is fetched relatively, so
        # nothing else has to know about the subpath.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:deploy

      - name: Check the build has its data
        # The console is static: without the snapshot it renders six empty
        # screens, which is worse than failing here.
        run: test -s frontend/dist/demo-data.json && test -s frontend/dist/index.html

      - name: Publish to gh-pages
        # .nojekyll stops Pages running the output through Jekyll, which would
        # drop anything under a leading underscore.
        run: |
          set -euo pipefail
          touch frontend/dist/.nojekyll
          cd frontend/dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}" \
            -m "Build output only — edit frontend/ and let this workflow republish."
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
